# docker-compose.prod.yml — stack de producción con SQLite
# Uso: docker compose -f docker-compose.prod.yml up -d --build
#
# Variables necesarias en .env.prod (nunca subir al repo):
#   NEXTAUTH_URL=https://tu-dominio.com
#   NEXTAUTH_SECRET=<secreto-generado-con-openssl-rand-base64-32>

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      # La BD vive en /app/data (volumen nombrado), no en /app/prisma —
      # ahí también están las migraciones que trae la imagen, y un volumen
      # nombrado solo se rellena con el contenido de la imagen la PRIMERA
      # vez que se crea, así que una migración nueva en un rebuild futuro
      # no llegaría al volumen si comparte ruta con /app/prisma.
      DATABASE_URL: file:/app/data/prod.db
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV: production
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
