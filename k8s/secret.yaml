# k8s/secret.yaml
# Genera el NEXTAUTH_SECRET con: openssl rand -base64 32 | base64
# y sustituye el valor de nextauth-secret.
#
# IMPORTANTE: no commitear valores reales — usa Sealed Secrets o un vault.
apiVersion: v1
kind: Secret
metadata:
  name: gestor-cuadrantes-secret
  namespace: gestor-cuadrantes
type: Opaque
stringData:
  NEXTAUTH_SECRET: "REPLACE_WITH_STRONG_RANDOM_SECRET"
  # Para SQLite embebido (prueba):
  DATABASE_URL: "file:///data/prod.db"
  # Para PostgreSQL (producción real), comentar la línea anterior y usar:
  # DATABASE_URL: "postgresql://user:password@postgres-service:5432/gestor_cuadrantes"
