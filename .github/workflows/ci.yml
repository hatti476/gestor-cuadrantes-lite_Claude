name: CI — Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Type check + Lint + Unit tests + Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./test.db
      NEXTAUTH_SECRET: ci-test-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings 0

      - name: Setup test database
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npx vitest run --reporter=verbose --reporter=junit --outputFile=reports/unit-junit.xml

      - name: Publish unit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: reports/unit-junit.xml
          reporter: java-junit

      - name: Build
        run: npm run build
