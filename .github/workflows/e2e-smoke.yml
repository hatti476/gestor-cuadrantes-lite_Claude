name: E2E — Smoke Tests

on:
  pull_request:
    branches: [main]

jobs:
  e2e-smoke:
    name: E2E smoke suite (tests críticos)
    runs-on: ubuntu-latest
    env:
      # Ruta absoluta (no "file:./test.db"): el servidor "next start" en
      # background y el proceso aparte que siembra/resiembra la BD podrían
      # resolver una ruta relativa de forma distinta según su cwd — ver CP-171.
      DATABASE_URL: file:${{ github.workspace }}/prisma/test.db
      NEXTAUTH_SECRET: ci-test-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed test database
        # migrate deploy (no db:push) para que la BD quede con historial de
        # migraciones: el globalSetup de Playwright vuelve a correr `migrate
        # deploy` sobre esta misma BD (ya no la borra, ver CP-171) y sin
        # historial Prisma lo rechaza con P3005 "schema not empty".
        run: npx prisma migrate deploy && npm run db:seed

      - name: Build application
        run: npm run build

      - name: Start application
        # Salida redirigida a fichero: una vez termina este step, Actions deja
        # de capturar el stdout del proceso en background — sin esto no se ve
        # nada de lo que loguea el servidor durante los tests (CP-171).
        run: npm run start > /tmp/next-server.log 2>&1 &

      - name: Wait for app
        run: npx wait-on http://127.0.0.1:3000 --timeout 120000

      - name: Run smoke tests
        run: npx playwright test --config=playwright.ci.config.ts --grep @smoke --reporter=line,html

      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Next.js server log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-server-log
          path: /tmp/next-server.log
          if-no-files-found: ignore
